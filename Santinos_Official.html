<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Santino’s Supreme Slice Pizza · Management System</title>
<meta name="description" content="Accounting, inventory, sales monitoring and payroll system for Santino’s Supreme Slice Pizza."><meta name="theme-color" content="#06120c"><meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍕%3C/text%3E%3C/svg%3E">
<style>
:root{--gold:#d4af37;--bg1:#06120c;--bg2:#170a0c;--glass:rgba(255,255,255,.07);--bd:rgba(255,255,255,.14);--tx:#f6f3ec;--mut:#b9b4a8;--g:#009246;--r:#ce2b37;--o:#ffa21a;--in:rgba(0,0,0,.28);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg1:#e6f4ea;--bg2:#fde8e8;--glass:rgba(255,255,255,.7);--bd:rgba(0,0,0,.12);--tx:#1c1b18;--mut:#5d5a52;--in:rgba(255,255,255,.9)}}
:root[data-theme="light"]{--bg1:#e6f4ea;--bg2:#fde8e8;--glass:rgba(255,255,255,.7);--bd:rgba(0,0,0,.12);--tx:#1c1b18;--mut:#5d5a52;--in:rgba(255,255,255,.9)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--tx);background:linear-gradient(135deg,var(--bg1),var(--bg2)) fixed;min-height:100vh;display:flex}
aside{overflow-y:auto;width:232px;padding:16px 12px;background:var(--glass);backdrop-filter:blur(14px);border-right:1px solid var(--bd);position:sticky;top:0;height:100vh;flex:none;display:flex;flex-direction:column;gap:4px}
aside img{width:100%;border-radius:12px;margin-bottom:8px}
nav button.h{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.08em;color:var(--mut);padding:6px 8px;text-transform:uppercase;font-weight:700}nav button.h:hover{background:none;color:var(--tx)}
.sec{background:var(--glass);border:1px solid var(--bd);border-radius:14px;padding:6px;margin-bottom:10px}.sec.c .it{display:none}.sec.c .ar{transform:rotate(-90deg)}.ar{transition:.2s}
.foot{margin-top:auto;font-size:12px;color:var(--mut);padding:10px;border:1px solid var(--bd);border-radius:14px;background:var(--glass)}.foot button{margin-top:6px;background:none;border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:4px 8px;cursor:pointer}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--tx);padding:10px 12px;border-radius:10px;font-size:14px;cursor:pointer}
nav button:hover{background:var(--glass)}nav button.on{background:linear-gradient(90deg,var(--g),var(--r));color:#fff}
/*dl*/.dl{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}.rp{position:sticky;top:12px}.rp .card{margin-bottom:12px;padding:14px}.rp h2{display:flex;justify-content:space-between}.rp .ln{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--bd)}.rp .ln:last-child{border:0}.rp button.b{width:100%;margin:3px 0;text-align:left}
main{flex:1;padding:20px;min-width:0}h1{margin:0 0 4px;font-size:22px}h2{font-size:15px;margin:0 0 10px}.sub{color:var(--mut);margin-bottom:16px}
.card{background:var(--glass);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:16px;backdrop-filter:blur(10px)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.k{background:var(--glass);border:1px solid var(--bd);border-radius:14px;padding:14px;border-top:3px solid var(--g)}.k:nth-child(3n+2){border-top-color:var(--o)}.k:nth-child(3n){border-top-color:var(--r)}
.k small{color:var(--mut)}.k b{display:block;font-size:20px;margin-top:4px}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:600;font-size:12px}tfoot td{font-weight:700}
input,select,textarea{background:var(--in);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;font:inherit;max-width:100%}td input{width:72px;text-align:right}input[type=text],input[type=date],select{width:auto}
button.b{background:linear-gradient(90deg,var(--g),#0aa85a);color:#fff;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;font:inherit;margin:2px}button.b.r{background:linear-gradient(90deg,var(--r),#e5484d)}button.b.o{background:linear-gradient(90deg,var(--o),#ffbf4d);color:#2a1a00}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.pos{color:#3ddc84}.neg{color:#ff6b6b}.tag{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--glass);border:1px solid var(--bd);font-size:12px}
@media(max-width:1100px){.dl{grid-template-columns:1fr}.rp{position:static}}
@media(max-width:760px){.foot{display:none}.sec{margin:0;display:flex;align-items:center;flex:none}.sec .it{display:flex}.sec.c .it{display:flex}nav button.h{display:none}body{display:block}aside{width:100%;height:auto;position:sticky;flex-direction:row;overflow-x:auto;padding:8px;z-index:5}aside img{display:none}nav{display:flex;gap:4px}nav button{white-space:nowrap}main{padding:12px}}

/*premium*/
body{background:radial-gradient(1000px 520px at 0 0,color-mix(in srgb,var(--g) 32%,transparent),transparent),radial-gradient(900px 520px at 100% 0,color-mix(in srgb,var(--r) 26%,transparent),transparent),linear-gradient(160deg,var(--bg1),var(--bg2)) fixed}
.bt0{display:none}aside{padding:18px 14px;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border-right:1px solid color-mix(in srgb,var(--gold) 35%,transparent);box-shadow:8px 0 40px rgba(0,0,0,.35)}
aside img{border:1px solid var(--gold);border-radius:18px;margin:0 0 6px;box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 0 4px rgba(212,175,55,.1)}
.bt{font-size:10px;letter-spacing:.32em;color:var(--gold);text-align:center;margin:2px 0 14px;font-weight:700}
h1{font-family:Georgia,'Times New Roman',serif;font-size:28px;font-weight:700;letter-spacing:.01em}
h1::after{content:"";display:block;width:72px;height:3px;margin-top:8px;border-radius:3px;background:linear-gradient(90deg,var(--g) 33%,#fff 33% 66%,var(--r) 66%)}
h2{letter-spacing:.04em;text-transform:uppercase;font-size:12px;color:var(--gold)}
.card,.k,.sec{border-color:color-mix(in srgb,var(--gold) 28%,var(--bd));box-shadow:0 10px 30px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.08)}
.k{border-top:0;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}.k::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--g),var(--gold),var(--r))}
.k:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(0,0,0,.4)}
.k small{text-transform:uppercase;letter-spacing:.1em;font-size:10px}.k b{font-family:Georgia,serif;font-size:24px;margin-top:6px}
nav button.on{background:linear-gradient(90deg,rgba(212,175,55,.28),rgba(212,175,55,.04));color:var(--tx);box-shadow:inset 3px 0 0 var(--gold);font-weight:600}
th{text-transform:uppercase;letter-spacing:.08em;font-size:10px}tbody tr:hover td,table tr:hover td{background:rgba(212,175,55,.06)}
button.b{background:linear-gradient(135deg,#f0cf6b,#b8902a);color:#1a1304;font-weight:700;box-shadow:0 4px 14px rgba(184,144,42,.35);transition:transform .15s}button.b:hover{transform:translateY(-1px)}
button.b.o{background:linear-gradient(135deg,#0aa85a,#007a3a);color:#fff;box-shadow:0 4px 14px rgba(0,146,70,.35)}button.b.r{background:linear-gradient(135deg,#e5484d,#a31d28);color:#fff;box-shadow:0 4px 14px rgba(206,43,55,.35)}
.tag{border-color:var(--gold);color:var(--gold)}input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--gold) 60%,transparent);outline-offset:1px}
@media(max-width:760px){aside img{display:block;width:112px;flex:none;margin:0 8px 0 0;border-radius:12px}.bt{display:none}h1{font-size:22px}}

.ph{display:none}@media print{.ph{display:block;text-align:center;margin-bottom:8px}aside,button,.bt,.foot{display:none!important}body{background:#fff!important;color:#000;display:block}main{padding:0}.card,.k{box-shadow:none;background:#fff;color:#000;border-color:#999;backdrop-filter:none}input,textarea,select{background:#fff;color:#000;border:0}h1,h2{color:#000;-webkit-text-fill-color:#000}.w{overflow:visible}}

body.lock aside,body.lock main{display:none}#lg{display:none}body.lock #lg{display:flex;position:fixed;inset:0;align-items:center;justify-content:center;padding:16px;z-index:50;overflow:auto}
.lgc{width:100%;max-width:380px;background:var(--glass);border:1px solid color-mix(in srgb,var(--gold) 40%,var(--bd));border-radius:22px;padding:24px;backdrop-filter:blur(16px);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.lgc img{width:100%;border-radius:16px;border:1px solid var(--gold);display:block}.lgc label{display:block;margin:10px 0;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.lgc input[type=text],.lgc input[type=password]{display:block;width:100%;margin-top:4px;padding:11px 12px;font-size:15px}.lgc label.ck{text-transform:none;letter-spacing:0;font-size:13px}

.lgc label,.lgc .sub{color:#d8d3c6}.lgc h1,.lgc label.ck{color:#f6f3ec}
.card,.sec,.foot{background:linear-gradient(145deg,rgba(0,146,70,.20),rgba(255,255,255,.05) 48%,rgba(206,43,55,.18))}
.k{background:linear-gradient(145deg,rgba(0,146,70,.34),rgba(255,255,255,.05) 70%)}.k:nth-child(3n+2){background:linear-gradient(145deg,rgba(255,162,26,.34),rgba(255,255,255,.05) 70%)}.k:nth-child(3n){background:linear-gradient(145deg,rgba(206,43,55,.34),rgba(255,255,255,.05) 70%)}

$('#m').innerHTML=`<h1>Settings &amp; Backup</h1><div class="sub">Business profile, price list and data safety</div>
<div class="card"><h2>Business profile</h2><div class="row">${T('company','Company')}${T('addr','Address')}<label>Box price ₱ <input type="number" value="${t.boxp}" oninput="db.set.boxp=n(this.value);BOXP=n(this.value)||355;save()"></label></div></div>
<div class="card"><h2>Type of outlet</h2><div class="w"><table style="min-width:0"><tr><th>Type</th><th>Outlets</th><th></th></tr>${db.set.brands.map((b,i)=>`<tr><td><input type="text" style="width:190px;text-align:left" value="${b}" onchange="chT(${i},this.value)"></td><td>${OL().filter(o=>o.b==b).length}</td><td><button class="b r" onclick="delT(${i})">✕</button></td></tr>`).join('')}</table></div><button class="b o" onclick="addT()">+ Add type</button></div>
<div class="card"><h2>Outlets (${OL().length})</h2><div class="w"><table style="min-width:0"><tr><th>Code</th><th>Outlet name</th><th>Address</th><th>Type of outlet</th><th></th></tr>${OL().map((o,i)=>`<tr><td><input type="text" style="width:56px" value="${o.c}" onchange="chO(${i},'c',this.value)"></td><td><input type="text" style="width:210px;text-align:left" value="${o.n}" onchange="chO(${i},'n',this.value)"></td><td><input type="text" style="width:220px;text-align:left" value="${o.a||''}" onchange="chO(${i},'a',this.value)"></td><td><select onchange="chO(${i},'b',this.value)">${db.set.brands.map(b=>`<option ${o.b==b?'selected':''}>${b}</option>`).join('')}</select></td><td><button class="b r" onclick="delO(${i})">✕</button></td></tr>`).join('')}</table></div><button class="b o" onclick="addO()">+ Add outlet</button></div>
<div class="card"><h2>Price list (defaults for new reports)</h2><div class="w"><table style="min-width:0"><tr><th>Product</th><th>Unit ₱</th></tr>${P.map(k=>`<tr><td>${k} (per slice)</td><td><input type="number" value="${t.pp[k]}" oninput="db.set.pp['${k}']=n(this.value);save()"></td></tr>`).join('')}${B.map(k=>`<tr><td>${k}</td><td><input type="number" value="${t.bp[k]}" oninput="db.set.bp['${k}']=n(this.value);save()"></td></tr>`).join('')}</table></div></div>
<div class="card"><h2>Backup &amp; restore</h2><div class="sub">All data is stored in this browser only. Download a backup regularly and before clearing browser data or changing devices.</div><div class="row"><button class="b" onclick="bk()">💾 Download backup (.json)</button><button class="b o" onclick="$('#rf').click()">📂 Restore backup</button><input id="rf" type="file" accept=".json,application/json" hidden onchange="rs(this)"></div></div>
<div class="card"><h2>Account (login)</h2><div class="sub">Signed-in user: <b>${au.u}</b>. Change the default credentials after your first login.</div><div class="row"><label>Current password <input id="cp" type="password" autocomplete="current-password"></label><label>Username <input id="nu" type="text" value="${au.u}"></label><label>New password <input id="np" type="password" autocomplete="new-password" placeholder="leave blank to keep"></label><label>Confirm <input id="n2" type="password" autocomplete="new-password"></label></div><button class="b" onclick="chpw()">Update account</button></div>
<div class="card"><h2>Danger zone</h2><button class="b r" onclick="wipe()">Erase all records (keeps settings)</button></div>`};
function chT(i,v){v=v.trim();const old=db.set.brands[i];if(!v||db.set.brands.some((x,j)=>j!=i&&x.toLowerCase()==v.toLowerCase())){V.set();return}db.set.brands[i]=v;OL().forEach(o=>{if(o.b==old)o.b=v});db.dsr.forEach(r=>{if(r.ot==old)r.ot=v});OF='all';save();V.set()}
function addT(){const v=prompt('New type of outlet:');if(!v||!v.trim())return;if(db.set.brands.some(x=>x.toLowerCase()==v.trim().toLowerCase())){alert('Type already exists.');return}db.set.brands.push(v.trim());save();V.set()}
function delT(i){const b=db.set.brands[i];if(OL().some(o=>o.b==b)){alert('Outlets are still using this type. Re-assign them first.');return}if(confirm('Remove type '+b+'?')){db.set.brands.splice(i,1);OF='all';save();V.set()}}
function chO(i,k,v){const o=db.set.outlets[i],old=o[k];v=v.trim();if(!v&&k!='a'){V.set();return}if(k=='c'&&OL().some((x,j)=>j!=i&&x.c==v)){alert('Code already in use.');V.set();return}o[k]=v;if(k=='n')db.dsr.forEach(r=>{if(r.oc==o.c)r.outlet=v});if(k=='b')db.dsr.forEach(r=>{if(r.oc==o.c)r.ot=v});if(k=='c'){db.dsr.forEach(r=>{if(r.oc==old)r.oc=v});db.dep.forEach(x=>{if(x[2]==old)x[2]=v});db.emp.forEach(e=>{if(e.oc==old)e.oc=v})}save()}
function addO(){const c=prompt('Outlet code (e.g. 26):');if(!c)return;if(OL().some(x=>x.c==c.trim())){alert('Code already in use.');return}const nm=prompt('Outlet name:');if(!nm)return;db.set.outlets.push({c:c.trim(),n:nm.trim(),b:db.set.brands[0]});db.set.outlets.sort((a,b)=>a.c.localeCompare(b.c,undefined,{numeric:true}));save();V.set()}
function delO(i){const o=OL()[i];if(db.dsr.some(r=>r.oc==o.c)){alert('This outlet has reports and cannot be removed.');return}if(confirm('Remove '+o.n+'?')){db.set.outlets.splice(i,1);save();V.set()}}
function bk(){dlf('santinos-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,1),'application/json')}
function rs(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.dsr)||!Array.isArray(d.dep)||!Array.isArray(d.emp))throw 0;if(!confirm('Replace ALL current data with this backup?'))return;db=d;db.set=Object.assign(DS(),db.set||{});BOXP=n(db.set.boxp)||355;save();go('dash')}catch(e){alert('Invalid backup file.')}};r.readAsText(f)}
function wipe(){if(prompt('This permanently erases ALL reports, deposits and payroll data from this browser.\nType ERASE to confirm.')==='ERASE'){const s0=db.set;db=seed();db.set=s0;save();go('dash')}}
const AK='stn_auth2';let au,fails=0,lock=0;try{au=JSON.parse(localStorage.getItem(AK))}catch(e){}
async function H(s,p){const t=new TextEncoder().encode(s+':'+p);try{const b=await crypto.subtle.digest('SHA-256',t);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s+':'+p)h=(h*33^c.charCodeAt(0))>>>0;return'f'+h}}
async function initAuth(){if(!au||!au.h){const s=Math.random().toString(36).slice(2);au={u:'admin',s,h:await H(s,'123456')};try{localStorage.setItem(AK,JSON.stringify(au))}catch(e){}}}
async function login(e){e.preventDefault();const E=$('#le');if(Date.now()<lock){E.textContent='Too many attempts. Try again in '+Math.ceil((lock-Date.now())/1000)+'s.';return false}
await initAuth();const u=$('#lu').value.trim().toLowerCase(),h=await H(au.s,$('#lp').value);
if(u===au.u.toLowerCase()&&h===au.h){fails=0;try{sessionStorage.setItem('stn_s','1')}catch(x){}enter()}else{if(++fails>=5){lock=Date.now()+30000;fails=0;E.textContent='Too many attempts. Locked for 30 seconds.'}else E.textContent='Incorrect username or password.';$('#lp').value=''}return false}
function enter(){$('#lp').value='';$('#le').textContent='';document.body.classList.remove('lock');go('dash')}
function logout(){try{sessionStorage.removeItem('stn_s')}catch(e){}$('#lu').value='';document.body.classList.add('lock');$('#m').innerHTML=''}
async function chpw(){const cp=$('#cp').value,nu=$('#nu').value.trim(),np=$('#np').value,n2=$('#n2').value;if(await H(au.s,cp)!==au.h){alert('Current password is incorrect.');return}if(!nu){alert('Username is required.');return}if(np&&np.length<6){alert('New password must be at least 6 characters.');return}if(np!==n2){alert('Passwords do not match.');return}const s=Math.random().toString(36).slice(2);au={u:nu,s,h:await H(s,np||cp)};try{localStorage.setItem(AK,JSON.stringify(au))}catch(e){}alert('Account updated.');V.set()}
$('#lgi').src=document.querySelector('aside img').src;
initAuth().then(()=>{let ok=false;try{ok=sessionStorage.getItem('stn_s')==='1'}catch(e){}if(ok)enter();else $('#lu').focus()});
</script></body></html>
